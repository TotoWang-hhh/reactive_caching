[build-system]
requires = ["setuptools >= 61"]
build-backend = "setuptools.build_meta"

[project]
name = "reactive_caching"
dynamic = ["version"]
authors = [
  {name = "rgzz666", email = "tt1224@hotmail.com"},
]
description = "Caching module for class properties, with automatic invalidation based on attribute changes."
readme = "README.md"
keywords = [
    "caching", 
    "cache", 
    "reactive", 
    "property", 
    "attribute", 
    "attr", 
    "performance", 
    "something new", 
    "something interesting", 
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "Apache-2.0"
dependencies = []
requires-python = ">= 3.10"

[project.urls]
Repository = "https://github.com/totowang-hhh/reactive_caching/"
"Author's Site" = "https://rgzz666.top"

[tool.setuptools]
py-modules = ["reactive_caching"]

[tool.setuptools.dynamic]
version = {attr = "reactive_caching.__version__"}